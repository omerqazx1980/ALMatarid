<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>أسرة آل مطارد - بنو عمرو</title>
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=ann66">
</head>
<body>
  <div id="demo" hidden>نسخة تجريبية ببيانات وهمية لتجربة التصميم فقط</div>
  <header>
    <img class="logo" src="logo.jpg" alt="" width="46" height="46">
    <div class="ttl"><h1>أسرة آل مطارد - بنو عمرو <span class="beta">موقع تجريبي</span></h1><p>AL MUTARID · توثيق الأنساب والتراث وصلة الأرحام</p></div>
    <nav id="feat" hidden aria-label="أقسام مُبرزة"></nav>
    <div class="hbtns"><details class="more"><summary>الأقسام<span id="menu-dot" class="dot" hidden></span></summary>
      <div class="menu">
        <div id="adm-menu" hidden>
          <button id="m-export">📦 تصدير نسخة احتياطية</button>
          <button id="m-annpost">📢 نشر إعلان عام</button>
          <button id="m-inbox" hidden>📥 صندوق الاقتراحات <span id="inbox-badge" class="bdg" hidden></span></button>
          <button id="m-branches" hidden>👥 مسؤولو الفروع</button>
          <button id="m-log" hidden>📜 سجل التغييرات</button>
          <button id="m-snap" hidden>📸 لقطة احتياطية في القاعدة</button>
          <button id="m-settings" hidden>⚙️ إعدادات الوصول</button>
          <div class="tgl-sec">
            <div class="tgl-h">إظهار / إخفاء العناصر</div>
            <button id="m-genstep">👁️ عداد الأجيال</button>
            <button id="m-stats">👁️ الإحصائيات</button>
            <button id="m-ctl">👁️ أزرار الفتح والطي</button>
          </div>
          <hr>
        </div>
        <button id="m-cities">📍 المدن والمحافظات</button>
        <button id="m-names">📋 جميع الأسماء</button>
        <button id="m-events">🎉 مناسبات الأسرة</button>
        <button id="m-honor">🏅 لوحة الشرف</button>
        <button id="m-cards">💌 بطاقات التهاني والتعازي</button>
        <button id="m-family" hidden>👨‍👩‍👧 محرر العائلة</button>
        <button id="m-kin">🧭 مستكشف القرابة</button>
        <button id="m-suggest">📝 اقتراح وتصحيح</button>
        <button disabled>🖼️ مشجر جداري <small>قريبًا</small></button>
        <button id="m-csv">📊 تصدير إكسل</button>
      </div>
    </details>
    <button id="btn-login" class="ghost">دخول</button></div>
  </header>
  <div id="event" hidden></div>
  <div id="newsbar" hidden></div>
  <section class="stats"><div id="chips"></div><div class="ctl"><button id="btn-open" class="lnk" aria-label="فتح الكل"><span class="ic">➕</span>فتح الكل</button><button id="btn-close" class="lnk" aria-label="طي الكل"><span class="ic">➖</span>طي الكل</button></div></section>
  <section id="genstep" class="genstep"><button id="btn-gen-minus" aria-label="إخفاء جيل" title="إخفاء جيل">−</button><span id="genstep-val">الأجيال: 1 إلى 2</span><button id="btn-gen-plus" aria-label="إظهار جيل إضافي" title="إظهار جيل إضافي">+</button></section>
  <div class="bar">
    <input id="q" type="search" placeholder="ابحث بالاسم أو الكنية" autocomplete="off">
    <div id="qn" hidden><button id="qp" class="ghost" aria-label="النتيجة السابقة">›</button><span id="qc"></span><button id="qx" class="ghost" aria-label="النتيجة التالية">‹</button></div>
    <div class="seg" role="group" aria-label="طريقة العرض"><button id="v-graph" aria-label="عرض المخطط"><span class="ic">🌳</span>مخطط</button><button id="v-list" aria-label="عرض القائمة"><span class="ic">☰</span>قائمة</button></div>
  </div>

  <main>
    <div id="vp" class="vp"><div id="stage"><svg id="lines"></svg><div id="nodes"></div></div>
      <div class="zoom"><button id="z-fit" class="zfit" aria-label="ملاءمة الشاشة">ملاءمة الشاشة</button></div>
    </div>
    <ul id="tree" class="tree" hidden></ul><p id="empty" hidden>لا توجد نتائج لهذا البحث.</p>
  </main>

  <dialog id="gate">
    <form method="dialog" id="gate-form">
      <h2 id="gate-title">أدخل الرمز</h2>
      <p id="gate-hint">رمز العائلة يفتح الشجرة. رمز المحرر أو المالك يفتح التعديل.</p>
      <div style="position: relative; display: flex; align-items: center; width: 100%; margin-bottom: 8px;">
        <input id="code" type="password" autocomplete="off" placeholder="الرمز" style="width: 100%; padding-left: 38px; box-sizing: border-box;">
        <button type="button" id="btn-toggle-code" aria-label="إظهار الرمز" style="position: absolute; left: 8px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; line-height: 1;">👁️</button>
      </div>
      <p id="gate-err" class="err" hidden></p>
      <div class="row"><button type="submit">دخول</button><button type="button" id="gate-x" class="ghost">إلغاء</button></div>
    </form>
  </dialog>

  <dialog id="form"><form id="form-el"><h2 id="form-title"></h2><div id="form-fields"></div><p id="form-err" class="err" hidden></p>
    <div class="row"><button type="submit">حفظ</button><button type="button" id="form-x" class="ghost">إلغاء</button></div></form></dialog>

  <dialog id="profile"><div id="profile-body"></div><button id="profile-x" class="ghost">إغلاق</button></dialog>

  <input type="file" id="photo-file" accept="image/*" hidden>
  <input type="file" id="ev-file" accept="image/*" hidden>
  <script src="js/config.js?v=ann17"></script>
  <script src="js/api.js?v=ann65"></script>
  <script src="js/app.js?v=ann66"></script>
  <script>
    const btnToggle = document.getElementById('btn-toggle-code');
    const inputCode = document.getElementById('code');
    if (btnToggle && inputCode) {
      btnToggle.addEventListener('click', () => {
        const isPassword = inputCode.type === 'password';
        inputCode.type = isPassword ? 'text' : 'password';
        btnToggle.textContent = isPassword ? '🔒' : '👁️';
      });
    }
  </script>
  <div id="toast" hidden></div>
  <nav id="bbar" aria-label="تنقل سريع">
    <button id="bb-graph" type="button"><span class="bb-ic">🌳</span><span>الشجرة</span></button>
    <button id="bb-search" type="button"><span class="bb-ic">🔍</span><span>بحث</span></button>
    <button id="bb-events" type="button"><span class="bb-ic">🎉</span><span>المناسبات</span></button>
    <span id="bb-more-slot"></span>
  </nav>
</body>
</html>
